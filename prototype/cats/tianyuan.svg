<svg xmlns="http://www.w3.org/2000/svg" viewBox="244 12 312 292" data-cat="tianyuan" data-art-style="fur">
  <style>
:root {
  --ink: #1d1b22;
  --fur-black: #26232b;
  --fur-white: #fffdf8;
  --pink: #ff9eb0;
  --iris: #b9e36b;
  --bg: #dfe6f5;
  --cream: #fbf6ea;
  --cream-dark: #e8dfca;
  --coral: #ff7a59;
  --coat-base: var(--fur-white);
  --coat-ear: var(--fur-black);
  --coat-inner-ear: var(--pink);
  --coat-lid-l: var(--fur-black);
  --coat-lid-r: var(--fur-white);
  --coat-eye-arc-l: var(--fur-white);
  --coat-eye-arc-r: var(--ink);
  --coat-arm-l: var(--fur-black);
  --coat-arm-r: var(--fur-white);
  --coat-paw-l: var(--fur-black);
  --coat-paw-r: var(--fur-white);
  --coat-toe-l: #77707f;
  --coat-toe-r: var(--ink);
  --coat-toe-opacity: 1;
  --coat-tail: var(--fur-black);
  --coat-tail-tip: var(--fur-white);
  --coat-iris: var(--iris);
  --coat-iris-l: var(--coat-iris);
  --coat-iris-r: var(--coat-iris);
  --coat-whisker: var(--ink);
  --coat-whisker-opacity: 1;
  --coat-brow: var(--ink);
  --coat-nose: var(--pink);
  --coat-mouth-line: var(--ink);
  --coat-blush-opacity: 0.45;
  --coat-brow-l: #8f8898;
}

svg[data-cat]:where(:not([data-cat="cow"])) {
  --coat-lid-l: var(--coat-base);
  --coat-lid-r: var(--coat-base);
  --coat-eye-arc-l: var(--ink);
  --coat-arm-l: var(--coat-base);
  --coat-arm-r: var(--coat-base);
  --coat-toe-l: var(--ink);
  --coat-brow-l: var(--ink);
}

svg:is([data-cat="orange"], [data-cat="lihua"]) {
  --coat-paw-l: var(--coat-light);
  --coat-paw-r: var(--coat-light);
  --coat-tail: var(--coat-base);
  --coat-tail-tip: var(--coat-stripe);
}

svg[data-cat="orange"] {
  --coat-base: #f4a957;
  --coat-stripe: #d97a2b;
  --coat-light: #fff1dc;
  --coat-ear: var(--coat-base);
  --coat-iris: #e8c547;
  --coat-toe-opacity: 0.6;
}

svg[data-cat="lihua"] {
  --coat-base: #a98a5f;
  --coat-stripe: #2a221c;
  --coat-light: #f4ede0;
  --coat-belly: #c9b18b;
  --coat-paw-l: var(--coat-base);
  --coat-paw-r: var(--coat-base);
  --coat-ear: url(#coat-lihua-ear);
  --coat-inner-ear: #e3a3a0;
  --coat-iris: #c9d84f;
  --coat-blush-opacity: 0.3;
}

svg[data-cat="siamese"] {
  --coat-base: #f4ead8;
  --coat-point: #5b4334;
  --coat-transition: #a8876c;
  --coat-ear: var(--coat-point);
  --coat-inner-ear: #b98080;
  --coat-lid-l: #5d4333; /* 眼周面罩色，取自 head.png */
  --coat-lid-r: #5d4333;
  --coat-eye-arc-l: var(--coat-mouth-line);
  --coat-eye-arc-r: var(--coat-mouth-line);
  --coat-paw-l: var(--coat-point);
  --coat-paw-r: var(--coat-point);
  --coat-toe-l: var(--coat-mouth-line);
  --coat-toe-r: var(--coat-mouth-line);
  --coat-tail: var(--coat-point);
  --coat-tail-tip: none;
  --coat-iris: #7ec8f0;
  --coat-nose: #3a2a22;
  --coat-mouth-line: #eadfcd;
  --coat-blush-opacity: 0;
}

svg:is([data-cat="black"], [data-cat="calico"], [data-cat="blue"],
        [data-cat="white"], [data-cat="maine"], [data-cat="sphynx"]) {
  --coat-ear: var(--coat-base);
  --coat-paw-l: var(--coat-base);
  --coat-paw-r: var(--coat-base);
  --coat-tail: var(--coat-base);
  --coat-tail-tip: var(--coat-base);
  --coat-brow-l: var(--coat-brow);
}
svg[data-cat="black"] {
  --coat-base: #26232b;
  --coat-eye-arc-l: #e8e2ec;
  --coat-eye-arc-r: #e8e2ec;
  --coat-iris: #f0c030;
  --coat-nose: #3a3036;
  --coat-mouth-line: #d8d0dc;
  --coat-whisker: #d8d0dc;
  --coat-brow: #e8e2ec;
  --coat-brow-l: var(--coat-brow);
  --coat-blush-opacity: 0;
}
svg[data-cat="calico"] {
  --coat-base: #fffdf8;
  --coat-lid-l: #26232b; /* 左眼在黑块里、右眼在橘块里，取自 head.png */
  --coat-lid-r: #e68b40;
  --coat-eye-arc-l: #e8e2ec;
  --coat-iris: #e0a63a;
  --coat-blush-opacity: 0.4;
}
svg[data-cat="calico"][data-art-style="line"] {
  --coat-tail: var(--coat-lid-l);
  --coat-tail-tip: var(--coat-tail);
}
svg[data-cat="blue"] {
  --coat-base: #8d9aaa;
  --coat-iris: #e3963a;
  --coat-nose: #6b6f7c;
  --coat-blush-opacity: 0.2;
}
svg[data-cat="blue"]:not([data-art-style="line"]) {
  --coat-lid-l: #868c93; /* 眼周毛色，取自 head.webp */
  --coat-lid-r: #868c93;
}
svg[data-cat="white"] {
  --coat-base: #fffdf8;
  --coat-iris-l: #6cb8ec;
  --coat-iris-r: #e8b84a;
}
svg[data-cat="maine"] {
  --coat-base: #c3c7cd;
  --coat-iris: #b9c845;
  --coat-nose: #c27c6c;
  --coat-blush-opacity: 0.25;
}
svg[data-cat="maine"][data-art-style="line"] {
  --coat-stripe: #5c616b;
  --coat-light: #eef0f2;
  --coat-belly: var(--coat-light);
  --coat-ear: url(#coat-lihua-ear);
  --coat-tail-tip: var(--coat-stripe);
}
svg[data-cat="sphynx"] {
  --coat-base: #e6c3b3;
  --coat-iris: #b8d86a;
  --coat-nose: #d98f8f;
  --coat-whisker-opacity: 0.35;
  --coat-blush-opacity: 0.5;
}


#scene .ink { stroke: var(--ink); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
#scene .ink-line { stroke: var(--ink); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
#scene .ink-thin { stroke: var(--ink); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
#scene .coat-base { fill: var(--coat-base); }
#scene .coat-cow-marking { fill: var(--fur-black); }
#scene .coat-ear { fill: var(--coat-ear); }
svg[data-cat="calico"][data-art-style="line"] #scene :is(#ear-l, #strike-ear-r) .coat-ear,
#scene .coat-calico-dark { fill: var(--coat-lid-l); }
svg[data-cat="calico"][data-art-style="line"] #scene :is(#ear-r, #strike-ear-l) .coat-ear,
#scene .coat-calico-orange { fill: var(--coat-lid-r); }
#scene .coat-inner-ear { fill: var(--coat-inner-ear); }
#scene .coat-paw-l { fill: var(--coat-paw-l); }
#scene .coat-paw-r { fill: var(--coat-paw-r); }
#scene .coat-light { fill: var(--coat-light); }
#scene .coat-solid-stripe { fill: var(--coat-stripe); }
#scene .coat-stripe { fill: none; stroke: var(--coat-stripe); stroke-linecap: round; stroke-linejoin: round; }
#scene .coat-belly { fill: var(--coat-belly); }
#scene .coat-rim { fill: none; stroke: var(--coat-light); stroke-width: 7; }
#scene .coat-stop-base { stop-color: var(--coat-base); }
#scene .coat-stop-stripe { stop-color: var(--coat-stripe); }
#scene .coat-stop-point { stop-color: var(--coat-point); }
#scene .coat-stop-transition { stop-color: var(--coat-transition); }
#scene .coat-nose { fill: var(--coat-nose); }
#scene .coat-mouth-line { stroke: var(--coat-mouth-line); }
#scene .blush { fill: var(--pink); opacity: var(--coat-blush-opacity); }
svg[data-cat]:not([data-cat="cow"]) #scene .coat-cow-marking,
svg:not([data-cat="orange"]) #scene [data-coat-pattern="orange"],
svg:not([data-cat="lihua"]) #scene [data-coat-pattern="lihua"],
svg:not([data-cat="siamese"]) #scene [data-coat-pattern="siamese"],
svg:not([data-cat="calico"][data-art-style="line"]) #scene [data-coat-pattern="calico"],
svg:not([data-cat="maine"][data-art-style="line"]) #scene [data-coat-pattern="maine"] { display: none; }
#scene .shadow { fill: var(--ink); opacity: 0.1; }

#scene .sclera { fill: var(--fur-white); }
#scene #iris-l { fill: var(--coat-iris-l); }
#scene #iris-r { fill: var(--coat-iris-r); }
#scene .pupil { fill: var(--ink); }
#scene .shine { fill: #fff; }
#scene .lid-l { fill: var(--coat-lid-l); }
#scene .lid-r { fill: var(--coat-lid-r); }
#scene .lid-line { stroke: var(--ink); stroke-width: 4; stroke-linecap: round; }
/* 眼皮下沿和闭眼弧线同色：深色毛上用浅色线，眼皮往下落时还看得出是在闭眼 */
#scene #lidline-l { stroke: var(--coat-eye-arc-l); }
#scene #lidline-r { stroke: var(--coat-eye-arc-r); }
#scene .eye-ring { fill: none; stroke: var(--ink); stroke-width: 5; }
#scene .eye-arc-l, #scene .eye-arc-r { fill: none; stroke-width: 5; stroke-linecap: round; }
#scene .eye-arc-l { stroke: var(--coat-eye-arc-l); }
#scene .eye-arc-r { stroke: var(--coat-eye-arc-r); }
#scene .whisker { fill: none; stroke: var(--coat-whisker); opacity: var(--coat-whisker-opacity); stroke-width: 3; stroke-linecap: round; }
#scene .fang { fill: #fff; stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; }



svg[data-cat="tianyuan"] {
  --coat-base: #d9a24e;
  --coat-dark: #b97e33;
  --coat-back: #c48a3a;
  --coat-light: #f3ddb0;
  --coat-muzzle: #8a5a2b;
  --coat-ear: var(--coat-base);
  --coat-inner-ear: #e8b9a0;
  --coat-paw-l: var(--coat-light);
  --coat-paw-r: var(--coat-light);
  --coat-pad: #cfab82;
  --coat-iris: #956337;
  --coat-nose: #251c17;
  --coat-mouth-line: #4c3022;
  --coat-tail: url(#coat-tianyuan-tail);
  --coat-tail-tip: #e9cb93;
  --coat-blush-opacity: 0.35;
}
</style>
  <defs>
    <clipPath id="clip-head">
      <path id="clip-head-path" d="M 400 72 C 462 72, 522 102, 529 158 C 535 200, 522 234, 492 254 C 476 264, 467 272, 463 283 C 457 295, 432 300, 400 300 C 368 300, 343 295, 337 283 C 333 272, 324 264, 308 254 C 278 234, 265 200, 271 158 C 278 102, 338 72, 400 72 Z" />
    </clipPath>
    <clipPath id="clip-eye-l">
      <circle cx="352" cy="166" r="27" />
    </clipPath>
    <clipPath id="clip-eye-r">
      <circle cx="448" cy="166" r="27" />
    </clipPath>
    <radialGradient id="coat-tianyuan-cheeks" cy="48%" r="52%">
      <stop offset="18%" stop-color="var(--coat-light)" />
      <stop offset="100%" stop-color="var(--coat-light)" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="coat-tianyuan-muzzle" cy="58%" r="52%">
      <stop offset="36%" stop-color="var(--coat-light)" />
      <stop offset="76%" stop-color="var(--coat-light)" stop-opacity="0.55" />
      <stop offset="100%" stop-color="var(--coat-light)" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="coat-tianyuan-nose-shade" cy="42%" r="53%">
      <stop offset="34%" stop-color="var(--coat-muzzle)" stop-opacity="0.8" />
      <stop offset="70%" stop-color="var(--coat-dark)" stop-opacity="0.38" />
      <stop offset="100%" stop-color="var(--coat-dark)" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="coat-tianyuan-chest">
      <stop offset="12%" stop-color="var(--coat-light)" />
      <stop offset="100%" stop-color="var(--coat-light)" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="coat-tianyuan-back">
      <stop offset="20%" stop-color="var(--coat-back)" />
      <stop offset="100%" stop-color="var(--coat-back)" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="coat-tianyuan-arm" gradientUnits="userSpaceOnUse" x1="0" y1="298" x2="0" y2="470">
      <stop offset="15%" stop-color="var(--coat-base)" />
      <stop offset="100%" stop-color="var(--coat-light)" />
    </linearGradient>
    <linearGradient id="coat-tianyuan-tail" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="25%" stop-color="var(--coat-base)" />
      <stop offset="100%" stop-color="var(--coat-light)" />
    </linearGradient>
  </defs>
  <g id="scene" transform="rotate(0 400 281) translate(400 281) scale(1 1) translate(-400 -281)">
    <g id="ear-l">
      <g class="ear-shape-l">
        <path class="coat-ear ink dog-ear-outline" d="M 291 130 C 286 97 291 60 300 35 Q 304 25 311 32 C 333 52 350 83 361 113 L 351 140 Z" />
        <path class="coat-inner-ear" d="M 304 106 C 300 88 301 62 307 47 Q 329 66 345 100 Z" />
        <path fill="var(--coat-light)" opacity=".65" d="M 309 106 Q 310 92 307 84 L 317 91 L 318 82 L 332 99 Z" />
      </g>
    </g>
    <g id="ear-r">
      <g class="ear-shape-r">
        <g transform="translate(800 0) scale(-1 1)">
          <path class="coat-ear ink dog-ear-outline" d="M 291 130 C 286 97 291 60 300 35 Q 304 25 311 32 C 333 52 350 83 361 113 L 351 140 Z" />
          <path class="coat-inner-ear" d="M 304 106 C 300 88 301 62 307 47 Q 329 66 345 100 Z" />
          <path fill="var(--coat-light)" opacity=".65" d="M 309 106 Q 310 92 307 84 L 317 91 L 318 82 L 332 99 Z" />
        </g>
      </g>
    </g>
    <path id="head-fill" class="coat-base" d="M 400 72 C 462 72, 522 102, 529 158 C 535 200, 522 234, 492 254 C 476 264, 467 272, 463 283 C 457 295, 432 300, 400 300 C 368 300, 343 295, 337 283 C 333 272, 324 264, 308 254 C 278 234, 265 200, 271 158 C 278 102, 338 72, 400 72 Z" />
    <g clip-path="url(#clip-head)">
      <ellipse cx="400" cy="248" rx="99" ry="52" fill="url(#coat-tianyuan-cheeks)" />
      <ellipse cx="400" cy="240" rx="56" ry="46" fill="url(#coat-tianyuan-muzzle)" />
      <ellipse cx="400" cy="220" rx="30" ry="22" fill="url(#coat-tianyuan-nose-shade)" />
    </g>
    <path id="head-line" class="ink-line" fill="none" d="M 400 72 C 462 72, 522 102, 529 158 C 535 200, 522 234, 492 254 C 476 264, 467 272, 463 283 C 457 295, 432 300, 400 300 C 368 300, 343 295, 337 283 C 333 272, 324 264, 308 254 C 278 234, 265 200, 271 158 C 278 102, 338 72, 400 72 Z" />
    <ellipse class="blush" cx="325" cy="220" rx="14" ry="7" />
    <ellipse class="blush" cx="475" cy="220" rx="14" ry="7" />
    <g id="eye-l-open">
      <circle class="sclera" cx="352" cy="166" r="27" />
      <g clip-path="url(#clip-eye-l)">
        <circle id="iris-l" class="iris" cx="352" cy="166.6" r="20" />
        <circle id="pupil-l" class="pupil" cx="352" cy="167" r="13" />
        <circle id="shine-l" class="shine" cx="346.5" cy="161.5" r="5" />
        <rect id="lid-l" class="lid-l" x="323" y="137" width="58" height="10.4" />
        <line id="lidline-l" class="lid-line" x1="323" x2="381" y1="147.4" y2="147.4" />
      </g>
      <circle class="eye-ring" cx="352" cy="166" r="27" />
    </g>
    <g id="eye-r-open">
      <circle class="sclera" cx="448" cy="166" r="27" />
      <g clip-path="url(#clip-eye-r)">
        <circle id="iris-r" class="iris" cx="448" cy="166.6" r="20" />
        <circle id="pupil-r" class="pupil" cx="448" cy="167" r="13" />
        <circle id="shine-r" class="shine" cx="442.5" cy="161.5" r="5" />
        <rect id="lid-r" class="lid-r" x="419" y="137" width="58" height="10.4" />
        <line id="lidline-r" class="lid-line" x1="419" x2="477" y1="147.4" y2="147.4" />
      </g>
      <circle class="eye-ring" cx="448" cy="166" r="27" />
    </g>
    <g id="dog-tongue" style="display:none">
      <path class="ink-thin" fill="#552e2d" d="M 376 236 Q 380 240 386 240 Q 394 240 400 233 Q 406 240 414 240 Q 420 240 424 236 C 419 258 381 258 376 236 Z" />
      <path class="ink-thin" fill="#ed929f" d="M 389 247 Q 400 241 411 247 V 257 C 411 271 389 271 389 257 Z" />
      <path d="M 400 250 V 261" fill="none" stroke="#bc6372" stroke-width="2" stroke-linecap="round" />
    </g>
    <path class="ink-thin coat-mouth-line" fill="none" d="M 400 225 V 233 M 376 236 Q 380 240 386 240 Q 394 240 400 233 Q 406 240 414 240 Q 420 240 424 236" />
    <path class="ink-thin coat-nose" d="M 383 211 C 383 206 389 204 400 204 C 411 204 417 206 417 211 C 417 217 406 224 400 224 C 394 224 383 217 383 211 Z" />
    <path d="M 391 209 Q 397 206 403 208" fill="none" stroke="#fff" opacity=".22" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
