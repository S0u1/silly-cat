# Windows 7 试验线（分支 exp/win7，不并入主线）。
# 只能手动运行：Actions → release → Run workflow，选 exp/win7。
#
# 组合：Rust 1.77.2（最后一个带 Windows 7 支持的稳定版）+ Tauri 2.11（Tauri 2.12 起放弃 Win7）。
# 依赖版本由 `cargo generate-lockfile` 在 rust-version = 1.77.2 下按 MSRV 回退解析得到，已提交在 Cargo.lock。
# 安装包用 webviewInstallMode = skip：新版 WebView2 引导程序在 Win7 上会崩，
# Win7 上要先自己装好 WebView2 运行库 109（Win7 能用的最后一版）。
name: release

on:
  workflow_dispatch:

jobs:
  win7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: 安装 Rust 1.77.2
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.77.2

      - name: 确认工具链版本
        shell: bash
        run: |
          rustc -V
          cargo -V
          npx --no-install tauri -V || true

      - name: 安装前端依赖（只有 @tauri-apps/cli）
        run: npm ci

      - name: 构建 NSIS 安装包
        run: npx tauri build --bundles nsis --ci

      - name: 静态检查导入表
        shell: bash
        run: |
          python -m pip install pefile
          python tools/win7-check-imports.py src-tauri/target/release/silly-cat.exe | tee win7-imports-report.txt

      - name: 整理产物
        if: always()
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p out
          installer=$(compgen -G 'src-tauri/target/release/bundle/nsis/*-setup.exe' | head -1 || true)
          if [[ -n $installer ]]; then cp "$installer" "out/SillyCat_win7_${version}_x64-setup.exe"; fi
          cp win7-imports-report.txt out/ 2>/dev/null || true
          ls -la out

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SillyCat-win7
          path: out/*
          if-no-files-found: warn
